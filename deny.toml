# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/
#
# Run locally:  cargo deny check
# CI enforces:  cargo deny check (see .github/workflows/contracts.yml)

[advisories]
# Fetch advisories from the RustSec Advisory Database.
# https://github.com/rustsec/advisory-db
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Deny crates with known security vulnerabilities
vulnerability = "deny"
# Warn on unmaintained crates (informational; does not block CI)
unmaintained = "warn"
# Warn on crates with security notices (non-vulnerability advisories)
notice = "warn"
# Warn on yanked crate versions
yanked = "warn"
# Ignore advisories below this CVSS score threshold (0.0 = report all)
severity-threshold = 0.0

# Advisory IDs to ignore (add with justification comment)
# Example:
# ignore = [
#   { id = "RUSTSEC-0000-0000", reason = "Affects API we do not use" }
# ]
ignore = []

[licenses]
# Deny crates with no detectable license
unlicensed = "deny"

# Explicitly allowed licenses — must match the policy in CONTRIBUTING.md
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0 OR MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Unicode-3.0 appears in some unicode-ident releases
    "Unicode-3.0",
    # OpenSSL is present as a transitive dep of some Stellar tooling (build only)
    "OpenSSL",
    # Zlib is used by miniz_oxide (compression in wasm toolchain)
    "Zlib",
    # CC0 public domain dedication (used by some cryptography crates for test vectors)
    "CC0-1.0",
]

# Explicitly denied licenses
deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0", "LGPL-2.0", "LGPL-2.1", "LGPL-3.0"]

# Emit a warning rather than error for copyleft licenses not in deny list
copyleft = "warn"

# Allow OSI-approved and FSF Free/Libre licenses that are in the allow list
allow-osi-fsf-free = "neither"

# Default for any license not matched by the rules above
default = "deny"

# Minimum confidence threshold for license detection from file text
confidence-threshold = 0.8

# Per-crate license exceptions (use sparingly with a comment)
exceptions = []

[bans]
# Warn (not deny) when multiple versions of the same crate are resolved.
# This keeps the dependency tree clean without blocking development.
multiple-versions = "warn"

# Deny specific crates outright (none currently)
deny = []

# Allow specific duplicate crate versions when they cannot be avoided
# Example:
# skip = [
#   { name = "bitflags", version = "1" },  # legacy dep from soroban-sdk
# ]
skip = [
    # base64 0.13 and 0.22 coexist because soroban-sdk and its transitive deps
    # have not yet unified on a single major version.
    { name = "base64", version = "0.13" },
    # darling 0.13/0.14 coexist from different macro crates; expected to resolve
    # once all soroban-sdk macros are updated.
    { name = "darling", version = "0.14" },
    { name = "darling_core", version = "0.14" },
    { name = "darling_macro", version = "0.14" },
    # indexmap 1.x is a transitive dep of some older crates; 2.x is current.
    { name = "indexmap", version = "1" },
]

# Allow sub-trees anchored at specific crates to have duplicate versions
# without generating individual skip entries for every transitive dep.
skip-tree = []

[sources]
# Only allow crates from the official crates.io registry
unknown-registry = "deny"
# Deny crates from unknown git repositories
unknown-git = "deny"

# Registries considered trusted
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Git repositories considered trusted (add with justification)
# Example:
# allow-git = ["https://github.com/stellar/rs-soroban-sdk"]
allow-git = []
